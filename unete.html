<style>
    .unete-colectivo {

}

.form-unete input,
.form-unete select,
.form-unete textarea {
  display: block;
  width: 100%;
  margin-bottom: 1em;
  padding: 0.8em;
  font-size: 1em;
}

.form-unete button {
  background: black;
  color: white;
  padding: 0.8em 1.5em;

  font-size: 1em;

<section class="unete-colectivo">
  <h2>¿Eres artista? Súmate al alarido</h2>
  <p>Buscamos artistas de cualquier disciplina que vibren con la palabra, la imagen o la acción.</p>

  <form class="form-unete" action="https://formsubmit.co/tucorreo@ejemplo.com" method="POST" enctype="multipart/form-data">
    <input type="text" name="nombre" placeholder="Nombre completo" required>
    <input type="email" name="email" placeholder="Correo de contacto" required>
    <input type="text" name="redes" placeholder="Instagram, web o portfolio">
    
    <select name="disciplina" required>
      <option disabled selected>Tu disciplina artística</option>
      <option value="poesia">Poesía</option>
      <option value="musica">Música</option>
      <option value="arte">Arte visual</option>
      <option value="escenica">Escénicas</option>
    </select>

    <textarea name="bio" placeholder="Cuéntanos sobre ti (máx 300 caracteres)" maxlength="300" rows="4" required></textarea>
    
    <label for="foto">Sube una imagen o retrato</label>
    <input type="file" name="foto" accept="image/*">

    <button type="submit">Enviar solicitud</button>

    <small class="legal">No usaremos tu información para nada fuera del colectivo.</small>
  </form>
</section>
