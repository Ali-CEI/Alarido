<html>
<STYLE>
.filtro{
    width: 30px;
    padding: 4px;
    background-color: var(--color-1);
    border-radius: 5px;
    mix-blend-mode: hard-light;
    position: absolute;
}

.filtro.desplegado{
    position: relative;
}

#filtro-form{
    display: none;
    flex-direction: column;
}

#filtro-form.desplegado{
    display: flex;
}

.labels{
    display: flex;
    justify-content: space-around;
    align-items: center;
}

#text{
    font-weight: bold;
    color: var(--color-1);
}
</style>

<section class="filtros-artistas">
    <img class="filtro" src="img/filtrar.png" alt="Filtrar">
  <form id="filtro-form">
      <h3>Filtrar artistas</h3>

    <div class="labels">
    <label>Género:
      <select id="filtro-genero" class="opciones">
        <option value="">Todos</option>
        <option value="poeta">Poesía</option>
        <option value="cantautor">Cantautor</option>
        <option value="rapera">Rap</option>
        <option value="fotógrafo">Fotografía</option>
        <option value="performer">Artista</option>
      </select>
    </label>

    <label>Tipo de arte:
      <select id="filtro-tipo" class="opciones">
        <option value="">Todos</option>
        <option value="poesia">Poesía</option>
        <option value="musica">Música</option>
        <option value="arte">Arte</option>
      </select>
    </label>

    <label>Localidad:
      <input type="text" id="filtro-localidad" placeholder="Introduce una ciudad">
    </label>

        <label>Edad:
      <select id="filtro-edad" class="opciones">
        <option value="">Todos</option>
        <option value="poesia">> 18 años</option>
        <option value="musica">18 - 35 años</option>
        <option value="arte">&lt;&nbsp;35 años</option>
      </select>
    </label>
</div>  
    <button type="submit">Filtrar</button>
  </form>
</section>
</html>
