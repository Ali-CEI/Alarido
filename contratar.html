<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Somos el alarido</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/estilo_tablets.css"> <!--Estilo para pantallas de menos de 1024px-->
  <link rel="stylesheet" href="css/estilo_mobile.css"> <!--Estilo para pantallas de menos de 480px-->
  <link rel="stylesheet" href="css/estilo_contacto.css">
    <link rel="stylesheet" href="css/estilo_contratar.css">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script defer src="js/funciones_contacta.js"></script> <!--Link java-->
  <script defer src="js/funciones_generales.js"></script> <!--Link java-->

</head>
<body>

  <h3 class="titulo-popup">Pide presupuesto</h3>

  <form>
    <div>
      <label for="tipo-evento">Tipo de evento</label>
      <select id="tipo-evento" name="tipo-evento">
        <option>Seleccionar tipo de evento</option>
      </select>
    </div>

    <div>
      <label for="comunidad">Comunidad</label>
      <select id="comunidad" name="comunidad">
        <option selected disabled>Lugar del evento</option>
        <option value="1">Cantabria</option>
        <option value="2">Castilla y León</option>
        <option value="3">Granada</option>
        <option value="4">Logroño</option>
        <option value="5">Madrid</option>
        <option value="6">Málaga</option>
        <option value="7">Cantabria</option>
        <option value="8">Valadolid</option>
        <option value="9">Zaragoza</option>
      </select>
    </div>

    <div>
      <label for="cp">Código Postal</label>
      <input type="text" id="cp" name="cp" />
    </div>

    <div>
      <label for="fecha">Día del evento</label>
      <input type="date" id="fecha" name="fecha" />
    </div>

    <div>
      <label for="hora">Hora del evento</label>
      <input type="time" id="hora" name="hora" min="00:00" max="23:59"/>
    </div>

    <div>
      <label for="duracion">Duración</label>
      <select id="duracion" name="duracion">
        <option>No lo sé</option>
      </select>
    </div>

    <div>
      <label for="asistentes">Número de asistentes</label>
      <select id="asistentes" name="asistentes">
        <option selected disabled>Número aproximado de asistentes</option>
        <option value="1">&lt; 10</option>
        <option value="1">10 - 50</option>
        <option value="1">50 - 100</option>
        <option value="1">+ 100</option>

      </select>
    </div>

    <div>
      <label for="presupuesto">Presupuesto aproximado</label>
      <select id="presupuesto" name="presupuesto">
        <option>Presupuesto aproximado</option>
      </select>
    </div>

    <div>
      <label for="interes">Grado de interés</label>
      <select id="interes" name="interes">
        <option>Grado de interés</option>
      </select>
    </div>

    <div class="full-width">
      <label for="lugar">Lugar</label>
      <input type="text" id="lugar" name="lugar" />
    </div>

    <div class="full-width">
      <label for="detalles">Detalles de tu fiesta o evento</label>
      <textarea id="detalles" name="detalles" placeholder="Incluye toda la información relevante..."></textarea>
    </div>

    <button type="submit">Enviar</button>
  </form>
  
</body>
</html>
